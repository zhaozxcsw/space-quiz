        <div class="rs-block left" data-page-node-id="kUeGIcCvY822N9BY11ANF3">
          <div class="rs-name" data-page-node-id="x33TUJg5BCGt9m2u2vYCQe">TEAM A</div>
          <div class="rs-num" id="result-a" data-page-node-id="28RqI9e6DBbrEZUFkJcp2S">0</div>
        </div>
        <div class="rs-block" style="font-size:clamp(20px,3vw,44px);color:#9FC4E8;font-weight:800" data-page-node-id="wEMbTB8xoRwlqAaNYtQUvN">VS</div>
        <div class="rs-block right" data-page-node-id="iXXgMz0GWBfPWiLM7zcI6Z">
          <div class="rs-name" data-page-node-id="WpOQp4IBKQ2MShvhwvbVHM">TEAM B</div>
          <div class="rs-num" id="result-b" data-page-node-id="jlQxzUhjFfjE33rYHEDA2P">0</div>
        </div>
      </div>
      <div class="winner-banner" id="winner-banner" data-page-node-id="MNWB7jSsmN0Qj2iJvo0bxA">TEAM A WINS!</div>
    </div>
    <div class="screen-footer footer-controls" data-page-node-id="vdaUWfjxa2cY28fOCvkkfY">
      <button class="btn btn-start" id="btn-check" data-page-node-id="rbumsuemwPfxITCK2FIQcR">CHECK THE ANSWERS</button>
    </div>
  </section>

  <!-- ============ ANSWERS SCREEN ============ -->
  <section class="screen" id="screen-answers" data-page-node-id="ud31bTARDqYvqGnVhygxrv">
    <div class="screen-top ans-top" data-page-node-id="mG1lRxSuWSqPArbKE2DJqS">
      <div class="ans-title" data-page-node-id="ZFxvzIas7t1i8yfNhsk1Ke">SPACE KNOWLEDGE — ANSWERS</div>
      <div class="ans-counter" id="ans-counter" data-page-node-id="D1uDI5iKkIyXhymwmxWFxU">Question 1 / 5</div>
    </div>
    <div class="screen-mid" data-page-node-id="m8CREQvxRqHLlWXVzANAm4">
      <div class="card" id="answers-card" data-page-node-id="FfD4uUrsNwcrF57afffKtZ"></div>
    </div>
    <div class="screen-footer footer-controls" id="answers-footer" data-page-node-id="WU7lWxtWkNKCPA7BAilrOO">
      <button class="btn btn-ghost" id="btn-prev" data-page-node-id="kLoKMOfvLxZ6bFBLqiMyLH">PREVIOUS</button>
      <button class="btn btn-next" id="btn-next-ans" data-page-node-id="fM4r0sFmTXE5G7NzAdc3v4">NEXT</button>
      <button class="btn btn-ghost hidden" id="btn-again" data-page-node-id="ddzRcnHIzDy5enFFieusC0">PLAY AGAIN</button>
      <button class="btn btn-ghost hidden" id="btn-home" data-page-node-id="mlKb8be5twPqXMg53jQT7I">BACK TO HOME</button>
    </div>
  </section>
</div>

<script>
/* ===================== DATA ===================== */
const QUESTIONS = [
  {
    text: "There are eight planets in the Solar System.",
    answer: true,
    explanation: "There are eight planets in our Solar System: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.",
    img: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="13" fill="#FFD23F"/>
      <circle cx="50" cy="50" r="13" fill="none" stroke="#FFE08A" stroke-width="2" opacity=".6"/>
      <ellipse cx="50" cy="50" rx="33" ry="14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <ellipse cx="50" cy="50" rx="43" ry="10" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
      <circle cx="83" cy="50" r="4.5" fill="#5BC8FF"/>
      <circle cx="93" cy="50" r="3" fill="#2EE6A6"/>
      <circle cx="65" cy="36" r="3.6" fill="#FF9F43"/>
    </svg>`
  },
  {
    text: "Footprints(脚印) left by astronauts on the lunar surface(月球表面) would disappear.",
    answer: false,
    explanation: "There is almost no atmosphere on the Moon. There is no wind or rain to wash the footprints away, so astronauts' footprints can remain for a very long time.",
    img: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="32" fill="#E2E8F0"/>
      <circle cx="40" cy="40" r="5" fill="#B6C2D0"/>
      <circle cx="62" cy="36" r="3.5" fill="#B6C2D0"/>
      <circle cx="58" cy="64" r="6" fill="#B6C2D0"/>
      <circle cx="36" cy="62" r="3" fill="#B6C2D0"/>
      <ellipse cx="50" cy="56" rx="7" ry="10" fill="#94A1B0"/>
      <circle cx="46" cy="42" r="2.6" fill="#94A1B0"/>
      <circle cx="52" cy="40" r="2.6" fill="#94A1B0"/>
      <circle cx="44" cy="46" r="2.2" fill="#94A1B0"/>
      <circle cx="55" cy="45" r="2.2" fill="#94A1B0"/>
    </svg>`
  },
  {
    text: "The hottest planet in the Solar System is Venus(金星).",
    answer: true,
    explanation: "Venus is the hottest planet in the Solar System. Its average surface temperature is about 462°C. Its thick atmosphere traps heat through a strong greenhouse effect.",
    img: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="30" fill="#F0A24B"/>
      <ellipse cx="50" cy="44" rx="26" ry="7" fill="#D98633" opacity=".55"/>
      <ellipse cx="50" cy="58" rx="22" ry="6" fill="#D98633" opacity=".45"/>
      <ellipse cx="50" cy="68" rx="14" ry="4" fill="#D98633" opacity=".4"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#FFD8A0" stroke-width="2" opacity=".5"/>
    </svg>`
  },
  {
    text: "The human body will explode(爆炸) in space without a spacesuit(太空服).",
    answer: false,
    explanation: "A human body would not explode in space. However, without a spacesuit, a person would quickly lose consciousness because of the lack of oxygen and the extremely low pressure.",
    img: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="36" r="17" fill="#EAF4FF"/>
      <circle cx="50" cy="36" r="11" fill="#3DA9E0"/>
      <ellipse cx="46" cy="32" rx="3.5" ry="5.5" fill="#BFE6FF" opacity=".7"/>
      <rect x="37" y="54" width="26" height="30" rx="11" fill="#EAF4FF"/>
      <rect x="41" y="57" width="18" height="15" rx="6" fill="#C9D8E8"/>
      <rect x="28" y="56" width="9" height="20" rx="4.5" fill="#EAF4FF"/>
      <rect x="63" y="56" width="9" height="20" rx="4.5" fill="#EAF4FF"/>
    </svg>`
  },
  {
    text: "There is no sound in space.",
    answer: true,
    explanation: "Sound needs a medium such as air, water or another material to travel through. Space is almost a vacuum, so sound cannot travel normally through space.",
    img: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M34 42 L46 42 L60 30 L60 70 L46 58 L34 58 Z" fill="#5BC8FF"/>
      <path d="M68 40 Q80 50 68 60" fill="none" stroke="#FF5A5A" stroke-width="4" stroke-linecap="round"/>
      <path d="M76 34 Q92 50 76 66" fill="none" stroke="#FF5A5A" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="88" y2="82" stroke="#FF5A5A" stroke-width="4" stroke-linecap="round"/>
    </svg>`
  }
];

/* ===================== STATE ===================== */
let currentIndex = 0;
let scoreA = 0;
let scoreB = 0;
let statusA = "idle";   // idle | correct | wrong
let statusB = "idle";
let roundOver = false;
let advanceTimer = null;

/* ===================== HELPERS ===================== */
const $ = (id) => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("screen-" + name).classList.add("active");
}

function buildStars() {
  const sf = $("starfield");
  const count = 170;
  let html = "";
  for (let i = 0; i < count; i++) {
    const size = (Math.random() * 2.4 + 0.8).toFixed(1);
    const left = (Math.random() * 100).toFixed(2);
    const top = (Math.random() * 100).toFixed(2);
    const delay = (Math.random() * 4).toFixed(2);
    const dur = (Math.random() * 3 + 2).toFixed(2);
    html += `<div class="star" style="width:${size}px;height:${size}px;left:${left}%;top:${top}%;animation-delay:${delay}s;animation-duration:${dur}s;"></div>`;
  }
  sf.innerHTML = html;
}

/* ===================== QUIZ FLOW ===================== */
function startMission() {
  currentIndex = 0;
  scoreA = 0; scoreB = 0;
  statusA = "idle"; statusB = "idle"; roundOver = false;
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  $("score-a").textContent = "0";
  $("score-b").textContent = "0";
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  statusA = "idle"; statusB = "idle"; roundOver = false;
  const q = QUESTIONS[currentIndex];

  $("q-counter").textContent = "Question " + (currentIndex + 1) + " / 5";
  $("question-text").textContent = q.text;
  $("question-img").innerHTML = q.img;

  ["a", "b"].forEach(t => {
    $("side-" + t).classList.remove("locked", "out");
    document.querySelectorAll(`.team-buttons[data-team="${t}"] .btn`).forEach(b => b.disabled = false);
    const fb = $("fb-" + t);
    fb.textContent = "";
    fb.className = "team-feedback";
  });

  $("btn-next").classList.add("hidden");
}

function chooseTeam(team, val) {
  if (roundOver) return;
  if ((team === "a" ? statusA : statusB) !== "idle") return;

  const q = QUESTIONS[currentIndex];
  const correct = (val === q.answer);
  const other = team === "a" ? "b" : "a";

  if (correct) {
    // correct -> that team scores, round ends, other team cannot answer
    if (team === "a") { scoreA++; $("score-a").textContent = scoreA; }
    else { scoreB++; $("score-b").textContent = scoreB; }
    popScore(team);
    setFeedback(team, true);
    $("side-" + team).classList.add("locked");   // winner glow
    $("side-" + other).classList.add("out");      // other team can't answer
    disableTeam(team); disableTeam(other);
    if (team === "a") statusA = "correct"; else statusB = "correct";
    roundOver = true;
    finishRound();
  } else {
    // wrong -> this team is out, the other team may steal
    setFeedback(team, false);
    $("side-" + team).classList.add("out");
    disableTeam(team);
    if (team === "a") statusA = "wrong"; else statusB = "wrong";
    if (statusA === "wrong" && statusB === "wrong") {
      // both wrong -> round over, no points
      roundOver = true;
      finishRound();
    }
    // otherwise the other team's buttons stay enabled to answer
  }
}

function setFeedback(team, correct) {
  const fb = $("fb-" + team);
  if (correct) { fb.textContent = "CORRECT! +1"; fb.className = "team-feedback correct"; }
  else { fb.textContent = "WRONG!"; fb.className = "team-feedback wrong"; }
}

function disableTeam(team) {
  document.querySelectorAll(`.team-buttons[data-team="${team}"] .btn`).forEach(b => b.disabled = true);
}

function popScore(team) {
  const el = team === "a" ? $("score-a") : $("score-b");
  el.classList.add("pop");
  setTimeout(() => el.classList.remove("pop"), 320);
}

// After a round is decided, reveal NEXT as a manual fallback AND auto-advance.
function finishRound() {
  const last = (currentIndex === QUESTIONS.length - 1);
  $("btn-next").textContent = last ? "SEE RESULT" : "NEXT QUESTION";
  $("btn-next").classList.remove("hidden");
  advanceTimer = setTimeout(() => {
    advanceTimer = null;
    nextQuestion();
  }, 1700);
}

function nextQuestion() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  if (currentIndex < QUESTIONS.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

/* ===================== RESULT ===================== */
function showResult() {
  $("result-a").textContent = scoreA;
  $("result-b").textContent = scoreB;
  const banner = $("winner-banner");
  if (scoreA > scoreB) {
    banner.textContent = "TEAM A WINS!";
    banner.className = "winner-banner a";
  } else if (scoreB > scoreA) {
    banner.textContent = "TEAM B WINS!";
    banner.className = "winner-banner b";
  } else {
    banner.textContent = "IT'S A TIE!";
    banner.className = "winner-banner tie";
  }
  showScreen("result");
  launchConfetti();
}

function launchConfetti() {
  const box = $("confetti");
  box.innerHTML = "";
  const colors = ["#FFD23F", "#38E0FF", "#FF9F43", "#2EE6A6", "#5BC8FF", "#FFFFFF"];
  const n = 80;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = (Math.random() * 100) + "%";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    const size = (Math.random() * 1.6 + 0.8).toFixed(1);
    c.style.width = size + "vw";
    c.style.height = size + "vw";
    c.style.animationDuration = (Math.random() * 3 + 3).toFixed(1) + "s";
    c.style.animationDelay = (Math.random() * 2).toFixed(1) + "s";
    box.appendChild(c);
  }
  setTimeout(() => { box.innerHTML = ""; }, 9000);
}

/* ===================== ANSWERS ===================== */
let ansIndex = 0;

function openAnswers() {
  ansIndex = 0;
  showScreen("answers");
  renderAnswerCard();
}

function renderAnswerCard() {
  const card = $("answers-card");
  const counter = $("ans-counter");
  const prev = $("btn-prev");
  const next = $("btn-next-ans");
  const again = $("btn-again");
  const home = $("btn-home");

  if (ansIndex >= QUESTIONS.length) {
    counter.textContent = "Complete";
    card.innerHTML = `
      <div class="finale">
        <div class="finale-big">MISSION ACCOMPLISHED!</div>
        <div class="finale-sub">Great job, space explorers!</div>
      </div>`;
    prev.classList.add("hidden");
    next.classList.add("hidden");
    again.classList.remove("hidden");
    home.classList.remove("hidden");
    return;
  }

  const q = QUESTIONS[ansIndex];
  counter.textContent = "Question " + (ansIndex + 1) + " / 5";
  card.innerHTML = `
    <div class="card-qnum">QUESTION ${ansIndex + 1} / 5</div>
    <div class="card-img">${q.img}</div>
    <div class="card-question">${q.text}</div>
    <div class="card-options">
      <div class="opt ${q.answer === true ? 'correct' : ''}">TRUE</div>
      <div class="opt ${q.answer === false ? 'correct' : ''}">FALSE</div>
    </div>
    <div class="card-answer"><span class="lbl">Correct Answer:&nbsp;</span><span class="val">${q.answer ? 'TRUE' : 'FALSE'}</span></div>
    <div class="card-exp"><span class="lbl">Explanation:&nbsp;</span>${q.explanation}</div>`;
  prev.classList.toggle("hidden", ansIndex === 0);
  next.classList.remove("hidden");
  next.textContent = (ansIndex === QUESTIONS.length - 1) ? "FINISH" : "NEXT";
  again.classList.add("hidden");
  home.classList.add("hidden");
  card.scrollTop = 0;
}

/* ===================== WIRE UP ===================== */
buildStars();
$("btn-start").addEventListener("click", startMission);
document.querySelectorAll(".team-buttons .btn").forEach(b => {
  b.addEventListener("click", () => chooseTeam(b.dataset.team, b.dataset.val === "true"));
});
$("btn-next").addEventListener("click", nextQuestion);
$("btn-check").addEventListener("click", openAnswers);
$("btn-next-ans").addEventListener("click", () => { ansIndex++; renderAnswerCard(); });
$("btn-prev").addEventListener("click", () => { if (ansIndex > 0) { ansIndex--; renderAnswerCard(); } });
$("btn-again").addEventListener("click", startMission);
$("btn-home").addEventListener("click", () => showScreen("start"));
</script>
</body>
</html>
